
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | GREENBRO AGRO</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="admin-dashboard">>

    <aside class="dashboard-sidebar">

        <div class="dashboard-logo">
            <a href="admin-dashboard.html">
                <img src="image/logo.png" alt="GREENBRO AGRO Logo">
            </a>
        </div>

        <nav class="sidebar-nav">
            <a href="admin-dashboard.html" class="active">Dashboard</a>
            <a href="admin-products.html">Manage Products</a>
            <a href="admin-orders.html">Manage Orders</a>
            <a href="admin-customers.html">Customers</a>
            <a href="index.html">View Website</a>
        </nav>

        <button id="logoutButton">Logout</button>

    </aside>

    <main class="dashboard-main">

        <header class="dashboard-header">
            <h1>Admin Dashboard</h1>
            <p>Welcome, <span id="adminName">Admin</span></p>
        </header>

        <section class="dashboard-content">

            <h2>Overview</h2>

            <div class="dashboard-cards">

                <div class="dashboard-card">
                    <h3>Total Products</h3>
                    <p>0</p>
                </div>

                <div class="dashboard-card">
                    <h3>Total Orders</h3>
                    <p>0</p>
                </div>

                <div class="dashboard-card">
                    <h3>Total Customers</h3>
                    <p>0</p>
                </div>

            </div>

            <h2>Quick Actions</h2>

            <div class="dashboard-actions">
                <a href="admin-products.html">Manage Products</a>
                <a href="admin-orders.html">Manage Orders</a>
                <a href="admin-customers.html">View Customers</a>
            </div>

        </section>

    </main>

    <script>
        const token = localStorage.getItem("greenbroToken");
        const savedUser = localStorage.getItem("greenbroUser");

        if (!token || !savedUser) {
            window.location.href = "login.html";
        } else {
            const user = JSON.parse(savedUser);

            if (user.role !== "admin") {
                window.location.href = "dashboard.html";
            } else {
                document.getElementById("adminName").textContent =
                    user.fullName.split(" ")[0];
            }
        }

        document.getElementById("logoutButton").addEventListener("click", function() {
            localStorage.removeItem("greenbroToken");
            localStorage.removeItem("greenbroUser");
            window.location.href = "login.html";
        });
    </script>

</body>
</html>
