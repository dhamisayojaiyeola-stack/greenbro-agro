
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | GREENBRO AGRO</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="auth-page">

    <header class="auth-header">
        <div class="auth-logo">
            <a href="index.html">
                <img src="image/logo.png" alt="GREENBRO AGRO Logo">
            </a>
        </div>

        <a href="index.html" class="back-home">Back to Home</a>
    </header>

    <main class="auth-container">

        <div class="auth-card">

            <h1>Create Your Account</h1>
            <p>Join GREENBRO AGRO and shop with ease.</p>

            <!-- GOOGLE SIGN UP -->
            <a href="/api/auth/google" class="google-auth-btn">
                <span class="google-icon">G</span>
                Continue with Google
            </a>

            <div class="auth-divider">
                <span>OR</span>
            </div>

            <!-- NORMAL REGISTRATION -->
            <form id="registerForm">

                <label for="fullName">Full Name</label>
                <input
                    type="text"
                    id="fullName"
                    placeholder="Enter your full name"
                    required
                >

                <label for="email">Email Address</label>
                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email address"
                    required
                >

                <label for="phone">Phone Number</label>
                <input
                    type="tel"
                    id="phone"
                    placeholder="Enter your phone number"
                    required
                >

                <label for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    placeholder="Create a password"
                    minlength="8"
                    required
                >

                <label for="confirmPassword">Confirm Password</label>
                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Enter your password again"
                    minlength="8"
                    required
                >

                <button type="submit" id="registerButton">
                    Create Account
                </button>

                <p id="registerMessage"></p>

            </form>

            <p class="auth-switch">
                Already have an account?
                <a href="login.html">Login here</a>
            </p>

        </div>

    </main>

    <script>
        const registerForm = document.getElementById("registerForm");
        const registerMessage = document.getElementById("registerMessage");
        const registerButton = document.getElementById("registerButton");

        registerForm.addEventListener("submit", async function(event) {
            event.preventDefault();

            const fullName = document.getElementById("fullName").value.trim();
            const email = document.getElementById("email").value.trim();
            const phone = document.getElementById("phone").value.trim();
            const password = document.getElementById("password").value;
            const confirmPassword = document.getElementById("confirmPassword").value;

            if (password !== confirmPassword) {
                registerMessage.textContent = "Passwords do not match.";
                registerMessage.style.color = "red";
                return;
            }

            registerButton.disabled = true;
            registerButton.textContent = "Creating Account...";
            registerMessage.textContent = "";

            try {
                const response = await fetch("/api/auth/register", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        fullName,
                        email,
                        phone,
                        password,
                        confirmPassword
                    })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.message || "Registration failed.");
                }

                registerMessage.textContent =
                    data.message + " You can now log in.";
                registerMessage.style.color = "green";

                registerForm.reset();

            } catch (error) {
                registerMessage.textContent = error.message;
                registerMessage.style.color = "red";
            } finally {
                registerButton.disabled = false;
                registerButton.textContent = "Create Account";
            }
        });
    </script>

</body>
</html>
